name: Customer Admin manual verification (publication disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/release-gates.mjs
      - run: npm test
      - run: npm run typecheck && npm run lint
      - name: Customer-only static build (no host publication)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://lckcibqosxgwxycvqzxp.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_RETAIL_SURFACE: public
          NEXT_PUBLIC_RECRUITMENT_PORTAL_ENABLED: 'false'
          NEXT_PUBLIC_WEBSITE_FEATURES_ENABLED: 'false'
          NEXT_PUBLIC_REAL_PORTFOLIO_ENABLED: 'false'
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo 'Browser-safe configuration missing'; exit 1; }
          npm run build
          npm run test:host-neutral-http
